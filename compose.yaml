name: seniors-empregabilidade-backend

services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: seniors_empregabilidade
      POSTGRES_USER: seniors
      POSTGRES_PASSWORD: seniors_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U seniors -d seniors_empregabilidade
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
