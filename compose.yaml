name: seniors-empregabilidade-backend

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: seniors_empregabilidade
      POSTGRES_USER: seniors
      POSTGRES_PASSWORD: seniors_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U seniors -d seniors_empregabilidade
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Local stand-in for the S3 uploads bucket. It accepts any credentials.
  s3:
    image: adobe/s3mock:4.7.0
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: seniors-uploads-local
    ports:
      - "9090:9090"

volumes:
  postgres_data:
